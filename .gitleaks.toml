# gitleaks config for flowctl: the default rules plus the TypeSafe (System 1) key, whose format the
# defaults do not know. Used by .github/workflows/security.yml.
title = "flowctl"

[extend]
useDefault = true

[[rules]]
id = "typesafe-api-key"
description = "TypeSafe API key assigned to TYPESAFE_API_KEY"
regex = '''TYPESAFE_API_KEY\s*[=:]\s*['"]?([A-Za-z0-9_\-]{16,})'''
secretGroup = 1
keywords = ["typesafe_api_key"]
