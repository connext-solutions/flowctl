name: Security

# One job. On a pull request: gitleaks on the new commits (blocks) and bun audit (report only).
# Weekly and on demand: gitleaks over the whole history too. History was scrubbed before the first
# push, so a finding here is new and worth a red check.
on:
  pull_request:
  schedule:
    - cron: '0 2 * * 1' # Monday 02:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # the token must not sit in .git/config inside the gitleaks container
          fetch-depth: 0 # gitleaks reads history: base..head on PRs, everything otherwise
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'
      # bun audit resolves from bun.lock; nothing to install. Advisories land in the run summary.
      - name: bun audit (report only)
        run: |
          {
            echo '## bun audit'
            echo '```'
            bun audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The gitleaks GitHub Action needs an org license; the binary is MIT, so run the image.
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          LOG_OPTS=""
          if [ "$EVENT" = "pull_request" ]; then
            LOG_OPTS="--log-opts=${BASE_SHA}..${HEAD_SHA}"
          fi
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --config /repo/.gitleaks.toml $LOG_OPTS --redact --verbose
