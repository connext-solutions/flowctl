name: Release

# ADR 0031: a release is a GitHub Release whose assets are the npm tarballs of core, cli and mcp; there is no
# npm registry. One job, run when a maintainer pushes a `v*` tag. It does not re-run verify, so it first refuses a
# tag whose commit is not on main, where every change was verified as a pull request. pack-release.mjs installs the
# tarballs into an empty project and runs both bins before anything is published. The job holds contents: write,
# so it restores no cache and runs no install scripts.
on:
  push:
    tags: ['v*']

# Never cancel a publish half way (an exception to the cancel-in-progress rule of the other workflows).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Pack and smoke-test the tarballs
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/pack-release.mjs --version "${TAG#v}" --out release
      - name: Publish the GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$TAG" in v0.*|*-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" release/*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $PRE
