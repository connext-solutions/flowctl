name: Release

# ADR 0031: a release is a GitHub Release whose assets are the npm tarballs of core, cli and mcp; there is no
# npm registry. One job, run when a maintainer pushes a `v*` tag. It does not re-run verify: the tagged commit
# is on main, where every change was verified as a pull request. pack-release.mjs installs the tarballs into an
# empty project and runs both bins before anything is published.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack and smoke-test the tarballs
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/pack-release.mjs --version "${TAG#v}" --out release
      - name: Publish the GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$TAG" in v0.*|*-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" release/*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $PRE
